# Kinds of item on the home page lists and news posts, each shown as a
# coloured circle with its icon, then its label. One colour per group, set in
# assets/style.css (.kind-news, .kind-alerts, .kind-classifieds): the site's
# accent pink for news, amber for alerts, slate for classifieds.
#
#   news:        a post sets `kind:` in its front matter; without one, a post
#                with a `finding:` is analysis and anything else an update
#   alerts:      the key a fetcher passes to helper.alert_rows()
#   classifieds: the category value in classified_categories (_config.yml)
#
# Icons are 24 x 24 Material Icons paths (Apache 2.0), except: Update is the
# Heroicons megaphone (MIT) from the site logo, and Flood is the Material
# Symbols "rainy" icon (Apache 2.0), drawn on its own grid (viewbox).
# demo: a sample title for each kind, shown on /admin/kinds.

