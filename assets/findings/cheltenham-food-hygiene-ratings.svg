<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="640" height="384" role="img" aria-labelledby="cheltenham-food-hygiene-ratings-title cheltenham-food-hygiene-ratings-desc">
<title id="cheltenham-food-hygiene-ratings-title">Cheltenham food businesses with a five-star hygiene rating</title>
<desc id="cheltenham-food-hygiene-ratings-desc">% rated 5 by type of business (types with 20 or more rated). Source: Food Standards Agency (OGL v3.0)</desc>

<style>
  .bg { fill: #fcfcfb; }
  .t1 { fill: #0b0b0b; font: 600 17px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .t2 { fill: #52514e; font: 13px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .lab { fill: #0b0b0b; font: 12px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .val { fill: #0b0b0b; font: 600 12px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .ax { fill: #52514e; font: 11px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .src { fill: #52514e; font: 11px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .base { stroke: #8a8984; stroke-width: 1; }
  .s1 { fill: #ca3393; }
  .s2 { fill: #2a78d6; }
  .mute { fill: #b9b8b3; }
  .line { fill: none; stroke: #ca3393; stroke-width: 2; }
  .dot { fill: #ca3393; stroke: #fcfcfb; stroke-width: 2; }
  .hatch { stroke: #fcfcfb; stroke-width: 2; }
</style>

<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>
