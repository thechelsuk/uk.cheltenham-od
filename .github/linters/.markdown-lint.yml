# Content pages are prose (front matter descriptions, intro paragraphs) that
# this repo has never hard-wrapped at 80/100/400 columns — plenty of existing
# pages already run past 400 chars on a line. Line-length isn't a useful
# signal for this content, so it's switched off rather than chased file by
# file.
MD013: false

# Inline HTML stays flagged, except for what content pages genuinely need:
# <section class="faqs" markdown="1"> marks a page's FAQs so the build can
# generate their FAQPage structured data (see _plugins/faq_schema.rb), and
# lists of links built in a Liquid loop (the newsletter archive) can't be
# written as Markdown.
MD033:
  allowed_elements: [section, ul, li, a]
