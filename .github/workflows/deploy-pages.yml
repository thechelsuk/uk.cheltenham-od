name: Deploy Pages

on:
    workflow_call:
        inputs:
            ref:
                required: false
                default: ""
                type: string

permissions:
    contents: read
    pages: write
    id-token: write
    # To find the last successful deploy, for IndexNow.
    deployments: read

# Let a running deploy finish: GitHub keeps at most one run waiting and
# replaces it with each newer push, so the latest commit still goes out
# without a slow runner letting every deploy be cancelled by the next.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            indexnow_urls: ${{ steps.indexnow.outputs.urls }}
        env:
            JEKYLL_ENV: production
            JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            PAGES_REPO_NWO: thechelsuk/uk.thechels.cod

        steps:
            # Full history (without file contents until needed) so
            # _plugins/data_freshness.rb can date each data file by its last
            # commit; a shallow checkout would give every file the same date.
            - name: Checkout requested ref
              if: inputs.ref != ''
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: 0
                  filter: blob:none

            - name: Checkout current ref
              if: inputs.ref == ''
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v6

            - name: Setup Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: 3.3.11
                  bundler-cache: true

            - name: Build site
              run: bundle exec jekyll build --config _config.yml,_config.production.yml --baseurl "${{ steps.pages.outputs.base_path }}"

            # IndexNow wants only pages that are new or have changed: those the
            # sitemap dates later than the commit the last successful deploy
            # published. A failure here must not stop the deploy.
            - name: Choose pages for IndexNow
              id: indexnow
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  previous=""
                  while read -r id sha; do
                      if gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[].state' | grep -qx success; then
                          previous="$sha"
                          break
                      fi
                  done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=10" --jq '.[] | "\(.id) \(.sha)"')

                  if [ -z "$previous" ]; then
                      echo "::warning::No recent successful deploy found; nothing sent to IndexNow"
                      exit 0
                  fi
                  since="$(git show -s --format=%cI "$previous")"
                  echo "Last successful deploy published $previous ($since)"
                  python3 _python/indexnow-urls.py --since "$since"

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: _site
                  include-hidden-files: true

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        outputs:
            page_url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

    # Runs only when the deploy succeeded and it changed a page worth a crawl.
    indexnow:
        needs: [build, deploy]
        if: needs.build.outputs.indexnow_urls != '' && needs.build.outputs.indexnow_urls != '[]'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Submit to IndexNow
              uses: ./.github/actions/indexnow
              with:
                  site-url: ${{ needs.deploy.outputs.page_url }}
                  urls: ${{ needs.build.outputs.indexnow_urls }}
                  key: ${{ secrets.INDEXNOW_KEY }}
