---
name: Crime Backfill Check
on:
    workflow_dispatch:
    # Started at 29 6 * * * UK time by the Pi (_python/pi/crontab.txt), with the
    # Cloudflare watchdog as backup. No GitHub schedule: it ran hours late.

permissions:
    contents: write

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Check out this repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install Python dependencies
              run: python -m pip install -r _python/requirements.txt

            # Months saved short while Gloucestershire Constabulary's data was
            # missing from police.uk; lists any that police.uk now has in full.
            - name: Check for backfilled crime months
              id: check
              run: python _python/crime-backfill-check.py

            - name: Re-fetch backfilled months
              if: steps.check.outputs.months != ''
              env:
                  MONTHS: ${{ steps.check.outputs.months }}
              run: |
                  for month in $MONTHS; do
                      python _python/crime.py --date "$month" --overwrite
                  done
                  python _python/crime-map.py || echo "::warning::crime-map.py failed"
                  echo "::notice::Re-fetched $MONTHS. Run _python/local/process-wards.py locally to update the ward pages."

            # No deploy here: a push from a workflow does not start Pages, so the
            # Pi's next push (every 5 minutes by day, hourly overnight) publishes
            # this commit. Deploying from this run reused the ID of a commit
            # Pages had already deployed, and blocked the push that followed.
            - name: Commit and push if changed
              id: commit
              if: steps.check.outputs.months != ''
              uses: ./.github/actions/commit-and-push
              with:
                  message: "Chore: Backfilled crime data pull for"
