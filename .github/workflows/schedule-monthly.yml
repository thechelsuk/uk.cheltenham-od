---
name: Scheduled Monthly
on:
    workflow_dispatch:
    schedule:
        - cron: "17 0 2 * *"

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    scheduled:
        outputs:
            changed: ${{ steps.commit.outputs.changed }}
            ref: ${{ steps.commit.outputs.ref }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out this repo
              uses: actions/checkout@v7

            - name: Fetch holidays data
              continue-on-error: true
              run: |
                  curl -f https://www.gov.uk/bank-holidays.json | jq . > /tmp/holidays.json \
                    && mv /tmp/holidays.json _data/holidays.json \
                    || echo "::warning::Failed to fetch holidays.json, keeping existing data"

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: 3.13.2

            - name: Install Python dependencies
              run: python -m pip install -r _python/requirements.txt

            - name: Fetch crime data
              run: |
                  python _python/crime.py || echo "::warning::crime.py failed, continuing with other scripts"
                  python _python/interests.py || echo "::warning::interests.py failed, continuing with other scripts"
                  python _python/hotels.py || echo "::warning::hotels.py failed, continuing with other scripts"
                  python _python/car-parks.py || echo "::warning::car-parks.py failed, continuing with other scripts"
                  python _python/cycle-routes.py || echo "::warning::cycle-routes.py failed, continuing with other scripts"
                  python _python/play-areas.py || echo "::warning::play-areas.py failed, continuing with other scripts"
                  python _python/cheltenham-stats.py || echo "::warning::cheltenham-stats.py failed, continuing with other scripts"
                  python _python/earnings.py || echo "::warning::earnings.py failed, continuing with other scripts"
                  python _python/economy.py || echo "::warning::economy.py failed, continuing with other scripts"
                  python _python/parkrun.py || echo "::warning::parkrun.py failed, continuing with other scripts"
                  python _python/listed-buildings.py || echo "::warning::listed-buildings.py failed, continuing with other scripts"
                  python _python/water-quality.py || echo "::warning::water-quality.py failed, continuing with other scripts"
                  python _python/council-tax.py || echo "::warning::council-tax.py failed, continuing with other scripts"
                  python _python/housing-supply.py || echo "::warning::housing-supply.py failed, continuing with other scripts"
                  python _python/station-usage.py || echo "::warning::station-usage.py failed, continuing with other scripts"
                  python _python/politics.py || echo "::warning::politics.py failed, continuing with other scripts"
                  python _python/nhs-sites.py || echo "::warning::nhs-sites.py failed, continuing with other scripts"

            - name: Commit and push if it changed
              id: commit
              run: |
                  git diff
                  git config user.name "GitHub Action"
                  git config user.email "action@github.com"
                  git add -A

                  if git diff --staged --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git commit -m "Chore: Monthly COD data pull for `date +'%Y-%m-%d %H:%M'`"
                  git push
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    deploy:
        needs: scheduled
        if: needs.scheduled.outputs.changed == 'true'
        uses: ./.github/workflows/deploy-pages.yml
        with:
            ref: ${{ needs.scheduled.outputs.ref }}
        secrets: inherit
