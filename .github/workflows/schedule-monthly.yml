---
name: Scheduled Monthly
on:
    workflow_dispatch:
    schedule:
        - cron: "17 0 2 * *"

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    scheduled:
        outputs:
            changed: ${{ steps.commit.outputs.changed }}
            ref: ${{ steps.commit.outputs.ref }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out this repo
              uses: actions/checkout@v7

            - name: Fetch holidays data
              run: |
                  curl https://www.gov.uk/bank-holidays.json | jq . > _data/holidays.json

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: 3.13.2

            - name: Install Python dependencies
              run: python -m pip install -r requirements.txt

            - name: Fetch crime data
              run: |
                  python _python/crime.py
                  python _python/interests.py
                  python _python/schools.py
                  python _python/hotels.py
                  python _python/wardband.py

            - name: Commit and push if it changed
              id: commit
              run: |
                  git diff
                  git config user.name "GitHub Action"
                  git config user.email "action@github.com"
                  git add -A

                  if git diff --staged --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git commit -m "Chore: Monthly COD data pull for `date +'%Y-%m-%d %H:%M'`"
                  git push
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    deploy:
        needs: scheduled
        if: needs.scheduled.outputs.changed == 'true'
        uses: ./.github/workflows/deploy-pages.yml
        with:
            ref: ${{ needs.scheduled.outputs.ref }}
        secrets: inherit
