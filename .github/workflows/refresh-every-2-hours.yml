---
name: Refresh Every 2 Hours
on:
    workflow_dispatch:
    # Started at 36 */2 * * * UK time by the Pi (_python/pi/crontab.txt), with the
    # Cloudflare watchdog as backup. No GitHub schedule: it ran hours late.

permissions:
    contents: write
    pull-requests: read
    issues: read

jobs:
    build:
        permissions:
            contents: write
            pull-requests: read
        runs-on: ubuntu-latest
        steps:
            - name: Check out Repo
              uses: actions/checkout@v7

            - name: Fetch latest FMS Data
              continue-on-error: true
              run: |-
                  curl -f "https://ratings.food.gov.uk/api/open-data-files/FHRS124en-GB.xml" -o /tmp/food-standards.xml \
                    && mv /tmp/food-standards.xml _data/food-standards.xml \
                    || echo "::warning::Failed to fetch food-standards.xml, keeping existing data"

            - name: Fetch latest FMS Data
              continue-on-error: true
              run: |-
                  curl -f "https://www.fixmystreet.com/rss/l/51.897991,-2.071308/10" -o /tmp/fix-my-street.xml \
                    && mv /tmp/fix-my-street.xml _data/fix-my-street.xml \
                    || echo "::warning::Failed to fetch fix-my-street.xml, keeping existing data"

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - uses: actions/cache@v6
              name: Configure pip Caching
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('_python/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install Python Dependencies
              run: |
                  python -m pip install -r _python/requirements.txt

            - name: Processing Python Scripts
              run: |-
                  python _python/fetch_status.py refresh-every-2-hours _python/news.py || echo "::warning::news.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/land-registry.py || echo "::warning::land-registry.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/house-summary.py || echo "::warning::house-summary.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/recycling.py || echo "::warning::recycling.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/fix-my-street.py || echo "::warning::fix-my-street.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/foodbank.py || echo "::warning::foodbank.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/air-quality.py || echo "::warning::air-quality.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/food-standards.py || echo "::warning::food-standards.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/bus-data.py || echo "::warning::bus-data.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/inpost.py || echo "::warning::inpost.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/dpd-pickup.py || echo "::warning::dpd-pickup.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/river-levels.py || echo "::warning::river-levels.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/sewage-overflows.py || echo "::warning::sewage-overflows.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/street-works.py || echo "::warning::street-works.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-every-2-hours _python/cheltenham-numbers.py || echo "::warning::cheltenham-numbers.py failed, continuing with other scripts"

            # No deploy here: a push from a workflow does not start Pages, so the
            # Pi's next push (every 5 minutes by day, hourly overnight) publishes
            # this commit. Deploying from this run reused the ID of a commit
            # Pages had already deployed, and blocked the push that followed.
            - name: Commit and push if changed
              id: commit
              uses: ./.github/actions/commit-and-push
              with:
                  message: "Chore: Hourly COD Data pull for"
