---
name: Python Tests

# Every push and pull request to main, except the automated data pulls from the
# Pi and the refresh workflows, which only change _data/ (about 150 commits a day).
on:
    push:
        branches: [main]
        paths-ignore:
            - "_data/**"
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: python-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pytest:
        name: pytest
        runs-on: ubuntu-latest
        steps:
            - name: Check out this repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: |
                      _python/requirements.txt
                      _python/requirements-dev.txt

            - name: Install Python dependencies
              run: python -m pip install -r _python/requirements.txt -r _python/requirements-dev.txt

            - name: Run the tests
              run: python -m pytest -q _python/tests
