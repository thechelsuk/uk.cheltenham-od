name: Linter
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  build:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Linter
        uses: github/super-linter/slim@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 0% duplication threshold is the wrong bar for a content-heavy
          # Jekyll site: sibling pages (crime/food-standards/house-prices
          # year pages, per-category layouts) are deliberately similar
          # front matter/structure, not a code smell to fix.
          VALIDATE_JSCPD: false
          # Prettier flags a touched file's *entire* pre-existing formatting,
          # not just the diff — and none of this repo's YAML has ever been
          # Prettier-formatted, so this would block the next PR that touches
          # any other workflow file too. Plain YAML syntax linting (VALIDATE_YAML)
          # stays on; this is purely a styling preference this repo hasn't adopted.
          VALIDATE_YAML_PRETTIER: false
