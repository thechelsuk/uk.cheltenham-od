---
name: News Digest Daily
on:
    workflow_dispatch:
    # Started at 46 8 * * * UK time by the Pi (_python/pi/crontab.txt), with the
    # Cloudflare watchdog as backup. No GitHub schedule: it ran hours late.
permissions:
    contents: write
    pull-requests: read
    issues: read

jobs:
    build:
        permissions:
            contents: write
            pull-requests: read
        runs-on: ubuntu-latest
        steps:
            - name: Check out Repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - uses: actions/cache@v6
              name: Configure pip Caching
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('_python/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install Python Dependencies
              run: |
                  python -m pip install -r _python/requirements.txt

            - name: Build daily news digest
              run: |-
                  python '_python/news-digest.py'

            # No deploy here: a push from a workflow does not start Pages, so the
            # Pi's next push (every 5 minutes by day, hourly overnight) publishes
            # this commit. Deploying from this run reused the ID of a commit
            # Pages had already deployed, and blocked the push that followed.
            - name: Commit and push if changed
              id: commit
              uses: ./.github/actions/commit-and-push
              with:
                  message: "Chore: Daily news digest for"
                  date-format: "%Y-%m-%d"
