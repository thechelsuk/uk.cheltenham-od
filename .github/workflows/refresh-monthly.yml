---
name: Refresh Monthly
on:
    workflow_dispatch:
    # Started at 17 0 2 * * UK time by the Pi (_python/pi/crontab.txt), with the
    # Cloudflare watchdog as backup. No GitHub schedule: it ran hours late.

permissions:
    contents: write

jobs:
    scheduled:
        runs-on: ubuntu-latest
        steps:
            - name: Check out this repo
              uses: actions/checkout@v7

            - name: Fetch holidays data
              continue-on-error: true
              run: |
                  curl -f https://www.gov.uk/bank-holidays.json | jq . > /tmp/holidays.json \
                    && mv /tmp/holidays.json _data/holidays.json \
                    || echo "::warning::Failed to fetch holidays.json, keeping existing data"

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install Python dependencies
              run: python -m pip install -r _python/requirements.txt

            - name: Fetch crime data
              env:
                  EPC_KEY: ${{ secrets.EPC_KEY }}
              run: |
                  python _python/fetch_status.py refresh-monthly _python/crime.py || echo "::warning::crime.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/small-areas.py || echo "::warning::small-areas.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/crime-map.py || echo "::warning::crime-map.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/interests.py || echo "::warning::interests.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/hotels.py || echo "::warning::hotels.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/car-parks.py || echo "::warning::car-parks.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/permit-zones.py || echo "::warning::permit-zones.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/cycle-routes.py || echo "::warning::cycle-routes.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/play-areas.py || echo "::warning::play-areas.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/green-spaces.py || echo "::warning::green-spaces.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/cheltenham-stats.py || echo "::warning::cheltenham-stats.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/earnings.py || echo "::warning::earnings.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/public-health.py || echo "::warning::public-health.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/economy.py || echo "::warning::economy.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/parkrun.py || echo "::warning::parkrun.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/listed-buildings.py || echo "::warning::listed-buildings.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/ward-politics.py || echo "::warning::ward-politics.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/water-quality.py || echo "::warning::water-quality.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/council-tax.py || echo "::warning::council-tax.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/housing-supply.py || echo "::warning::housing-supply.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/station-usage.py || echo "::warning::station-usage.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/politics.py || echo "::warning::politics.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/nhs-sites.py || echo "::warning::nhs-sites.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/dentists.py || echo "::warning::dentists.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/opticians.py || echo "::warning::opticians.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/rents.py || echo "::warning::rents.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/racing.py || echo "::warning::racing.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/affordability.py || echo "::warning::affordability.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/ofsted.py || echo "::warning::ofsted.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/childcare.py || echo "::warning::childcare.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/charities.py || echo "::warning::charities.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/taxi-ranks.py || echo "::warning::taxi-ranks.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/epc.py || echo "::warning::epc.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/renewable-energy.py || echo "::warning::renewable-energy.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-monthly _python/energy-use.py || echo "::warning::energy-use.py failed, continuing with other scripts"

            # No deploy here: a push from a workflow does not start Pages, so the
            # Pi's next push (every 5 minutes by day, hourly overnight) publishes
            # this commit. Deploying from this run reused the ID of a commit
            # Pages had already deployed, and blocked the push that followed.
            - name: Commit and push if changed
              id: commit
              uses: ./.github/actions/commit-and-push
              with:
                  message: "Chore: Monthly COD data pull for"
