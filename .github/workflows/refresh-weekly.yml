---
name: Refresh Weekly
on:
    workflow_dispatch:
    # Started at 23 4 * * MON UK time by the Pi (_python/pi/crontab.txt), with the
    # Cloudflare watchdog as backup. No GitHub schedule: it ran hours late.

permissions:
    contents: write

jobs:
    scheduled:
        runs-on: ubuntu-latest
        steps:
            - name: Check out this repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install Python dependencies
              run: python -m pip install -r _python/requirements.txt

            - name: Fetch weekly data
              env:
                  CQC_KEY: ${{ secrets.CQC_KEY }}
              run: |
                  python _python/fetch_status.py refresh-weekly _python/cqc.py || echo "::warning::cqc.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-weekly _python/bin-weeks.py || echo "::warning::bin-weeks.py failed, continuing with other scripts"

            # No deploy here: a push from a workflow does not start Pages, so the
            # Pi's next push (every 5 minutes by day, hourly overnight) publishes
            # this commit. Deploying from this run reused the ID of a commit
            # Pages had already deployed, and blocked the push that followed.
            - name: Commit and push if changed
              id: commit
              uses: ./.github/actions/commit-and-push
              with:
                  message: "Chore: Weekly COD data pull for"
