---
name: Scheduled Minutely
on:
    workflow_dispatch:

concurrency:
    group: alerts
    cancel-in-progress: false

permissions:
    contents: write
    pages: write
    id-token: write
    pull-requests: read
    issues: read

jobs:
    build:
        outputs:
            changed: ${{ steps.commit.outputs.changed }}
            ref: ${{ steps.commit.outputs.ref }}
        permissions:
            contents: write
            pull-requests: read
        runs-on: ubuntu-latest
        steps:
            - name: Check out Repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: 3.13.2

            - uses: actions/cache@v6
              name: Configure pip Caching
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('_python/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install Python Dependencies
              run: |
                  python -m pip install -r _python/requirements.txt

            - name: Processing Python Scripts
              run: |-
                  python '_python/bus-disruptions.py' || echo "::warning::bus-disruptions.py failed, continuing"
                  python '_python/power-cuts.py' || echo "::warning::power-cuts.py failed, continuing with other scripts"

            - name: Commit and push if changed
              id: commit
              run: |-
                  git diff
                  git config user.name "GitHub Action"
                  git config user.email "action@github.com"
                  git add -A

                  if git diff --staged --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git commit -m "Chore: Alerts data pull for $(date +'%Y-%m-%d %H:%M')"
                  # main moves on while this job runs (the Pi pushes every 5 minutes),
                  # so rebase onto the latest main and retry rather than losing the data.
                  pushed=false
                  for attempt in 1 2 3; do
                    if git pull --rebase --autostash && git push; then
                      pushed=true
                      break
                    fi
                    git rebase --abort 2>/dev/null || true
                    echo "Push attempt $attempt failed; retrying"
                    sleep $((attempt * 10))
                  done
                  if [ "$pushed" != true ]; then
                    echo "::error::Could not push the data update after 3 attempts"
                    exit 1
                  fi
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    deploy:
        needs: build
        if: needs.build.outputs.changed == 'true'
        uses: ./.github/workflows/deploy-pages.yml
        with:
            ref: ${{ needs.build.outputs.ref }}
        secrets: inherit
