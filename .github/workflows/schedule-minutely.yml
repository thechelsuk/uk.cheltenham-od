---
name: Scheduled Minutely
on:
    workflow_dispatch:

concurrency:
    group: alerts
    cancel-in-progress: false

permissions:
    contents: write
    pages: write
    id-token: write
    pull-requests: read
    issues: read

jobs:
    build:
        outputs:
            changed: ${{ steps.commit.outputs.changed }}
            ref: ${{ steps.commit.outputs.ref }}
        permissions:
            contents: write
            pull-requests: read
        runs-on: ubuntu-latest
        steps:
            - name: Check out Repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: 3.13.2

            - uses: actions/cache@v6
              name: Configure pip Caching
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('_python/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install Python Dependencies
              run: |
                  python -m pip install -r _python/requirements.txt

            # Stand-in for the Raspberry Pi: runs the same _python/pi/ scripts
            # the Pi's cron does, for when the Pi is down (a power cut, say).
            # Manual only, so it can be started from a phone and stopped once
            # the Pi is back; running both at once just makes duplicate commits.
            - name: Processing Python Scripts
              env:
                  FUEL_KEY: ${{ secrets.FUEL_KEY }}
                  FUEL_TOKEN: ${{ secrets.FUEL_TOKEN }}
                  NAT_HIGH_KEY: ${{ secrets.NAT_HIGH_KEY }}
                  RDM_LDBWS_KEY: ${{ secrets.RDM_LDBWS_KEY }}
              run: |-
                  python '_python/pi/buses.py' || echo "::warning::pi/buses.py failed, continuing with other scripts"
                  python '_python/pi/power.py' || echo "::warning::pi/power.py failed, continuing with other scripts"
                  python '_python/pi/fuel.py' || echo "::warning::pi/fuel.py failed, continuing with other scripts"
                  python '_python/pi/rail-times.py' || echo "::warning::pi/rail-times.py failed, continuing with other scripts"
                  python '_python/pi/unplanned-closures.py' || echo "::warning::pi/unplanned-closures.py failed, continuing with other scripts"

            - name: Commit and push if changed
              id: commit
              uses: ./.github/actions/commit-and-push
              with:
                  message: "Chore: Alerts data pull for"

    deploy:
        needs: build
        if: needs.build.outputs.changed == 'true'
        uses: ./.github/workflows/deploy-pages.yml
        with:
            ref: ${{ needs.build.outputs.ref }}
        secrets: inherit
