---
name: Scheduled Minutely
on:
    workflow_dispatch:
    schedule:
        - cron: "*/10 * * * *"

concurrency:
    group: bus-disruptions
    cancel-in-progress: false

permissions:
    contents: write
    pages: write
    id-token: write
    pull-requests: read
    issues: read

jobs:
    build:
        outputs:
            changed: ${{ steps.commit.outputs.changed }}
            ref: ${{ steps.commit.outputs.ref }}
        permissions:
            contents: write
            pull-requests: read
        runs-on: ubuntu-latest
        steps:
            - name: Check out Repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: 3.13.2

            - uses: actions/cache@v6
              name: Configure pip Caching
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install Python Dependencies
              run: |
                  python -m pip install -r requirements.txt

            - name: Processing Python Scripts
              run: |-
                  python '_python/bus-disruptions.py'

            - name: Commit and push if changed
              id: commit
              run: |-
                  git diff
                  git config user.name "GitHub Action"
                  git config user.email "action@github.com"
                  git add -A

                  if git diff --staged --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git commit -m "Chore: Bus disruptions data pull for `date +'%Y-%m-%d %H:%M'`"
                  git push
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    deploy:
        needs: build
        if: needs.build.outputs.changed == 'true'
        uses: ./.github/workflows/deploy-pages.yml
        with:
            ref: ${{ needs.build.outputs.ref }}
        secrets: inherit
