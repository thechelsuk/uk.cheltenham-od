name: "Link Checker"

on:
  workflow_dispatch:
  # Started at 13 20 * * FRI UK time by the Pi (_python/pi/crontab.txt), with the
  # Cloudflare watchdog as backup. No GitHub schedule: it ran hours late.

permissions:
  contents: read
  issues: write

# The shared link checker: builds the production site, checks internal and
# external links, and keeps one "broken-links" issue assigned to thechelsuk.
# (The old version failed the job before its issue steps, so three weeks of
# broken links, 2026-10-30 to 2026-11-13, were never reported.)
jobs:
  links:
    uses: thechelsuk/workflows/.github/workflows/link-checker.yml@main
    with:
      site_host: cheltenham-od\.uk
      ruby_version: 3.3.11
      jekyll_args: --config _config.yml,_config.production.yml
