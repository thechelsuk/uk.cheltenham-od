name: "Link Checker"

on:
  workflow_dispatch:
  # Started at 13 20 * * FRI UK time by the Pi (_python/pi/crontab.txt), with the
  # Cloudflare watchdog as backup. No GitHub schedule: it ran hours late.

permissions:
  contents: read
  issues: write

# The shared link checker: builds the production site, checks internal and
# external links, and keeps one "broken-links" issue assigned to thechelsuk.
# (The old version failed the job before its issue steps, so three weeks of
# broken links, 2026-10-30 to 2026-11-13, were never reported.)
jobs:
  links:
    uses: thechelsuk/workflows/.github/workflows/link-checker.yml@main
    with:
      site_host: cheltenham-od\.uk
      ruby_version: 3.3.11
      jekyll_args: --config _config.yml,_config.production.yml
      # Newsletter issues are dated archives: their event pages expire within
      # weeks, so links in them are left as published and not checked.
      extra_args: >-
        --exclude-path '_site/newsletter/'
        --exclude '^https?://(www\.)?(barchester\.com|farecare\.co\.uk|newlandscare\.org|cirencestermvc\.co\.uk|insight-glos\.org\.uk|outofthehat\.org\.uk|fishac\.org\.uk)(/|$)'
        --exclude '^https?://(www\.)?(ckjs\.org\.uk|cleeveschool\.net|lakesidechelt\.co\.uk|everymantheatre\.org\.uk|hazelwoods\.co\.uk|gloucester\.roundtable\.co\.uk|gloucestershire\.boys-brigade\.org\.uk|leckhamptonrovers\.co\.uk)(/|$)'
        --exclude '^https?://(www\.)?(therissingtonschool\.org\.uk|bishopscleeve\.gloucs\.sch\.uk|gloucesterroadprimary\.co\.uk|northleach\.gloucs\.sch\.uk|prestburystmarys\.co\.uk|prestburystmarysfederation\.co\.uk|rowanfieldinfant\.co\.uk|st-andrewsschool\.co\.uk)(/|$)'
        --exclude '^https://www\.johnlewis\.com/our-shops/events$'
        --exclude '^https://www\.waitrose\.com/content/waitrose/en/bf_home/bf/663\.html'
