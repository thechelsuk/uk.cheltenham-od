---
name: Post to Social
on:
    workflow_dispatch:
    workflow_run:
        workflows: ["Pages"]
        types: [completed]
    schedule:
        - cron: "17,47 * * * *"
permissions:
    contents: write

concurrency:
    group: social-post
    cancel-in-progress: false

jobs:
    post:
        # After a deploy, only when it succeeded. The schedule (which catches posts published by a
        # scheduled data deploy) and manual runs always go ahead.
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Check out Repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: 3.13.2

            - name: Install Python Dependencies
              run: |
                  python -m pip install -r _python/requirements.txt

            - name: Post new blog posts
              env:
                  BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
                  BLUESKY_APP_TOKEN: ${{ secrets.BLUESKY_APP_TOKEN }}
                  MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
              run: python '_python/social.py'

            - name: Commit and push if changed
              if: ${{ !cancelled() }}
              run: |-
                  git config user.name "GitHub Action"
                  git config user.email "action@github.com"
                  git add _data/social-posted.json

                  if git diff --staged --quiet; then
                    exit 0
                  fi

                  git commit -m "Chore: Social posts sent $(date +'%Y-%m-%d %H:%M')"
                  # main moves on while this job runs (the Pi pushes every 5 minutes),
                  # so rebase onto the latest main and retry rather than losing the data.
                  pushed=false
                  for attempt in 1 2 3; do
                    if git pull --rebase --autostash && git push; then
                      pushed=true
                      break
                    fi
                    git rebase --abort 2>/dev/null || true
                    echo "Push attempt $attempt failed; retrying"
                    sleep $((attempt * 10))
                  done
                  if [ "$pushed" != true ]; then
                    echo "::error::Could not push the data update after 3 attempts"
                    exit 1
                  fi
