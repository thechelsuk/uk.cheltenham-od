---
name: Post to Social
on:
    workflow_dispatch:
    workflow_run:
        workflows: ["Pages"]
        types: [completed]
    # Started at 17,47 * * * * UK time by the Pi (_python/pi/crontab.txt), with the
    # Cloudflare watchdog as backup. No GitHub schedule: it ran hours late.
permissions:
    contents: write

concurrency:
    group: social-post
    cancel-in-progress: false

jobs:
    # After a deploy: did the commit it published touch _posts/? Most deploys
    # are the Pi's data pushes, which never do, so this stops there without
    # installing Python.
    new-post:
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            found: ${{ steps.check.outputs.found }}
        steps:
            - name: Check the deployed commit for posts
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
                  SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  files="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.files[].filename')"
                  if grep -q '^_posts/' <<< "$files"; then
                      echo "found=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "found=false" >> "$GITHUB_OUTPUT"
                  fi

    post:
        needs: new-post
        # After a deploy, only when it published a post. The schedule (which catches every other
        # post: a scheduled one going live, the news digest) and manual runs always go ahead.
        if: ${{ !cancelled() && (github.event_name != 'workflow_run' || needs.new-post.outputs.found == 'true') }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out Repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install Python Dependencies
              run: |
                  python -m pip install -r _python/requirements.txt

            - name: Post new blog posts
              env:
                  BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
                  BLUESKY_APP_TOKEN: ${{ secrets.BLUESKY_APP_TOKEN }}
                  MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
                  DEVNULL_SSH_KEY: ${{ secrets.DEVNULL_SSH_KEY }}
              run: python '_python/social.py'

            - name: Commit and push if changed
              if: ${{ !cancelled() }}
              uses: ./.github/actions/commit-and-push
              with:
                  message: "Chore: Social posts sent"
                  paths: _data/social-posted.json
