---
name: Deploy Pi Watchdog

on:
    push:
        branches:
            - main
        paths:
            - "cloudflare/pi-watchdog/**"
            - "_python/pi/crontab.txt"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-watchdog
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy Worker
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: cloudflare/pi-watchdog
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            # Also checks the schedules match the Pi's crontab and that no
            # workflow has a GitHub schedule of its own.
            - name: Test
              run: npm test

            - name: Deploy to Cloudflare Workers
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: "4"
                  workingDirectory: cloudflare/pi-watchdog
                  secrets: |
                      GITHUB_TOKEN
                      HEARTBEAT_TOKEN
                      ADMIN_TOKEN
                      NOTIFY_TOKEN
                      RAW_GITHUB_TOKEN
                      FUEL_PROXY_TOKEN
              env:
                  GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
                  HEARTBEAT_TOKEN: ${{ secrets.WATCHDOG_HEARTBEAT_TOKEN }}
                  ADMIN_TOKEN: ${{ secrets.WATCHDOG_ADMIN_TOKEN }}
                  NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
                  RAW_GITHUB_TOKEN: ${{ secrets.WATCHDOG_RAW_GITHUB_TOKEN }}
                  FUEL_PROXY_TOKEN: ${{ secrets.WATCHDOG_FUEL_PROXY_TOKEN }}
