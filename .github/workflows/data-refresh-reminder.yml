name: "Data Refresh Reminder"

on:
  workflow_dispatch:
  schedule:
    # 10:00 on the 2nd of every month.
    - cron: '0 10 2 * *'

permissions:
  contents: read
  issues: write

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Check for an already-open reminder
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh issue list --repo "${{ github.repository }}" --label data-refresh --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.existing.outputs.count == '0'
        uses: actions/checkout@v7

      - name: Write reminder body
        if: steps.existing.outputs.count == '0'
        run: |
          cat > reminder.md <<'EOF'
          Monthly reminder to pull fresh source data for the manual, non-scheduled `_python/local/` scripts. Each source file goes in the gitignored `_data-sources/` folder, then run the matching script to refresh the site's `_data/*.json` output.

          When each source publishes, what it feeds and the full steps are in the [Data Releases and Manual Refreshes guide](https://github.com/thechelsuk/uk.cheltenham-od/blob/main/admin/guide/data-releases.md). Import `admin/data-releases.ics` for the dates.

          - [ ] **Schools** — download the latest GIAS extract from the [GIAS downloads page](https://get-information-schools.service.gov.uk/Downloads), save as `_data-sources/edubasealldata.csv`, then run `_python/local/process-schools-data.py`.
          - [ ] **Ofcom Connected Nations** (mobile + fixed broadband coverage) — check the [Connected Nations and infrastructure reports hub](https://www.ofcom.org.uk/phones-and-broadband/coverage-and-speeds/connected-nations-and-infrastructure-reports) for a newer release, save the mobile coverage CSV and run `_python/local/process-mobile-coverage.py`, and save the fixed broadband coverage CSV and run `_python/local/process-wardband.py`, then `_python/local/process-wards.py` so the ward pages pick up the new figures.
          - [ ] **Ward boundaries** — check the [ONS Open Geography Portal](https://geoportal.statistics.gov.uk/) for a newer "Wards Boundaries UK BGC" release, save as `_data-sources/wards.geojson`, then re-run `_python/local/process-wardband.py` and `_python/local/process-wards.py`.
          - [ ] **Children in low-income families** — check the [DWP local area statistics collection](https://www.gov.uk/government/collections/children-in-low-income-families-local-area-statistics) for a newer workbook, save it in `_data-sources/` (update the filename in `_python/local/process-low-income-kids.py` if needed), run `_python/local/process-low-income-kids.py` and `_python/local/process-wards.py` to refresh each ward profile, then commit the generated data.
          - [ ] **Election results** — only needed after a general election, so skip this item otherwise. Check the House of Commons Library's [elections data](https://commonslibrary.parliament.uk/tag/elections-data/) for a results dataset for the new election, save its by-candidate CSV in `_data-sources/`, run `_python/politics.py` first (it supplies the electorate), then update `_python/local/process-election-results.py` to read the new file and re-run it.

          - [ ] **Flood zones** — no file to download: run `_python/local/process-flood-zones.py`, which fetches the Environment Agency's latest Flood Zone 2 and 3 outlines itself, and commit the updated `_data/flood-zones.json`. The Environment Agency updates the data as needed, so this is only worth doing if the [dataset page](https://environment.data.gov.uk/dataset/04532375-a198-476e-985e-0579a0a11b47) shows a newer release.

          - [ ] **Road collisions** — check the [DfT road safety data](https://www.data.gov.uk/dataset/cb7ae6f0-4be6-4935-9277-47e5ce24a11f/road-safety-data) for a newer release (it is published once a year). Download the "last 5 years" collision, casualty and vehicle CSVs into `_data-sources/` (`https://data.dft.gov.uk/road-accidents-safety-data/dft-road-casualty-statistics-collision-last-5-years.csv`, and the same with `casualty` and `vehicle` in place of `collision`), update the three file name constants at the top of `_python/local/process-road-collisions.py` if the names have changed, run it, and commit the updated `_data/road-collisions.json`.

          - [ ] **Wildfire history** — check the [fire statistics incident level datasets](https://www.gov.uk/government/statistics/fire-statistics-incident-level-datasets) for a newer release (it is published once a year, in late July). Download every "Outdoor fires dataset" `.ods` file into `_data-sources/outdoor-fires/`, replacing the old ones, run `_python/local/process-wildfire-incidents.py`, and commit the updated `_data/wildfire-incidents.json`.

          - [ ] **Home energy scores** — no file to download: with `EPC_KEY` in `.env`, run `_python/local/epc-scores.py`. It reads the EPC register's search for Cheltenham, fetches full details only for homes with a new certificate since last month (stored in `_data-sources/epc-homes.json`), and rewrites `_data/epc-scores.json`. Commit that file. The ratings themselves (`_data/epc.json`) refresh automatically in the monthly workflow.

          - [ ] **Bin collections** — no download: check the council's [bank holiday collections page](https://www.cheltenham.gov.uk/bins-and-recycling/check-your-collection-day/bank-holiday-waste-and-recycling-collection/) for new or changed dates and its [what to put in your bin](https://www.cheltenham.gov.uk/bins-and-recycling/what-to-put-in-your-bin/) and garden waste pages for changes to containers, prices or the winter break, then update `_data/bin-collections.json`. The Week 1/Week 2 weeks refresh themselves weekly.

          - [ ] **Curated lists** — no download: check each list against the groups' and organisers' own sites, and update its JSON for anything added, closed or changed: `_data/clubs.json` (sports clubs, clubs and societies, arts and crafts), `_data/third-spaces.json`, `_data/helpful-contacts.json`, `_data/local-support.json`, `_data/festivals.json` (add the next dates once each festival's own site announces them), `_data/gloucestershire-cricket.json` and `_data/cycle-venues.json`. Their pages say "checked monthly". Also act on any additions or corrections sent through the contact form.

          Close this issue once done — a new one opens automatically next month.
          EOF

      # Hand-written pages carry a "reviewed:" date in their front matter.
      # Any not reviewed for six months are added to the list above.
      - name: Add hand-written pages due a review
        if: steps.existing.outputs.count == '0'
        run: |
          cutoff=$(date -d '6 months ago' +%F)
          : > due.md
          while IFS= read -r file; do
            reviewed=$(awk '/^---/{n++; next} n==1 && /^reviewed:/{print $2; exit}' "$file")
            [ -n "$reviewed" ] || continue
            if [[ "$reviewed" < "$cutoff" ]]; then
              url=$(awk '/^---/{n++; next} n==1 && /^permalink:/{print $2; exit}' "$file")
              echo "- [ ] **Review [${url}](https://cheltenham-od.uk${url})** — last reviewed ${reviewed}. Check its facts (official source for dates and figures, two sources for supporting facts), fix anything out of date, then set \`reviewed:\` to today in \`${file}\`." >> due.md
            fi
          done < <(find _pages -name '*.md' | sort)
          if [ -s due.md ]; then
            awk 'FNR==NR {due = due $0 "\n"; next} /^Close this issue/ {printf "%s\n", due} {print}' due.md reminder.md > reminder.tmp
            mv reminder.tmp reminder.md
          fi

      - name: Create reminder issue
        if: steps.existing.outputs.count == '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Monthly Data Refresh Reminder
          content-filepath: ./reminder.md
          labels: data-refresh
