name: "Data Refresh Reminder"

on:
  workflow_dispatch:
  # Started at 0 10 2 * * UK time by the Pi (_python/pi/crontab.txt), with the
  # Cloudflare watchdog as backup. No GitHub schedule: it ran hours late.

permissions:
  contents: read
  issues: write

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Check for an already-open reminder
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh issue list --repo "${{ github.repository }}" --label data-refresh --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.existing.outputs.count == '0'
        uses: actions/checkout@v7

      - name: Write reminder body
        if: steps.existing.outputs.count == '0'
        run: |
          cat > reminder.md <<'EOF'
          Monthly reminder to pull fresh source data for the manual, non-scheduled `_python/local/` scripts. Each source file goes in the gitignored `_data-sources/` folder, then run the matching script to refresh the site's `_data/*.json` output.

          When each source publishes, what it feeds and the full steps are in the [Data Releases and Manual Refreshes guide](https://github.com/thechelsuk/uk.cheltenham-od/blob/main/admin/guide/data-releases.md). Import `admin/data-releases.ics` for the dates.

          - [ ] **Schools** — on the [GIAS downloads page](https://get-information-schools.service.gov.uk/Downloads), under **All establishment data**, tick **Establishment fields CSV** (about 60 MB) and click **Download selected files**. Save the CSV (named `edubasealldataYYYYMMDD.csv`) as `_data-sources/edubasealldata.csv`, then run `_python/local/process-schools-data.py`.
          - [ ] **Ofcom Connected Nations** (mobile + fixed broadband coverage) — check the [Connected Nations and infrastructure reports hub](https://www.ofcom.org.uk/phones-and-broadband/coverage-and-speeds/connected-nations-and-infrastructure-reports) for a newer release, save the mobile coverage CSV and run `_python/local/process-mobile-coverage.py`, and save the fixed broadband coverage CSV and run `_python/local/process-wardband.py`, then `_python/local/process-wards.py` so the ward pages pick up the new figures.
          - [ ] **Ward boundaries** — on the [ONS Open Geography Portal](https://geoportal.statistics.gov.uk/search?q=Wards%20Boundaries%20UK%20BGC), search "Wards Boundaries UK BGC" and open the newest year (the current one is [Wards (May 2026) Boundaries UK BGC](https://geoportal.statistics.gov.uk/datasets/10c346276bf64c588916179d01c6e68f)). If it is newer than the one in use, click **Download**, choose **GeoJSON** (about 45 MB, every UK ward) and save it as `_data-sources/wards.geojson`. If its ward code field is a new year (e.g. `WD27CD`), add it to the front of `WARD_CODE_KEYS` in `_python/local/process-wardband.py`, then re-run `_python/local/process-wardband.py` and `_python/local/process-wards.py`.
          - [ ] **Children in low-income families** — check the [DWP local area statistics collection](https://www.gov.uk/government/collections/children-in-low-income-families-local-area-statistics) for a newer workbook, save it in `_data-sources/` (update the filename in `_python/local/process-low-income-kids.py` if needed), run `_python/local/process-low-income-kids.py` and `_python/local/process-wards.py` to refresh each ward profile, then commit the generated data.
          - [ ] **Election results** — only needed after a general election, so skip this item otherwise. Check the House of Commons Library's [elections data](https://commonslibrary.parliament.uk/tag/elections-data/) for a results dataset for the new election, save its by-candidate CSV in `_data-sources/`, run `_python/politics.py` first (it supplies the electorate), then update `_python/local/process-election-results.py` to read the new file and re-run it.

          - [ ] **Flood zones** — no file to download: run `_python/local/process-flood-zones.py`, which fetches the Environment Agency's latest Flood Zone 2 and 3 outlines itself, and commit the updated `_data/flood-zones.json`. The Environment Agency updates the data as needed, so this is only worth doing if the [dataset page](https://environment.data.gov.uk/dataset/04532375-a198-476e-985e-0579a0a11b47) shows a newer release.

          - [ ] **Road collisions** — check the [DfT road safety data](https://www.data.gov.uk/dataset/cb7ae6f0-4be6-4935-9277-47e5ce24a11f/road-safety-data) for a newer release (it is published once a year). Download the "last 5 years" collision, casualty and vehicle CSVs into `_data-sources/` (`https://data.dft.gov.uk/road-accidents-safety-data/dft-road-casualty-statistics-collision-last-5-years.csv`, and the same with `casualty` and `vehicle` in place of `collision`), update the three file name constants at the top of `_python/local/process-road-collisions.py` if the names have changed, run it, and commit the updated `_data/road-collisions.json`.

          - [ ] **Wildfire history** — check the [fire statistics incident level datasets](https://www.gov.uk/government/statistics/fire-statistics-incident-level-datasets) for a newer release (it is published once a year, in late July). Download every "Outdoor fires dataset" `.ods` file into `_data-sources/outdoor-fires/`, replacing the old ones, run `_python/local/process-wildfire-incidents.py`, and commit the updated `_data/wildfire-incidents.json`.

          - [ ] **Home energy scores** — no file to download: with `EPC_KEY` in `.env`, run `_python/local/process-epc-scores.py`. It reads the EPC register's search for Cheltenham, fetches full details only for homes with a new certificate since last month (stored in `_data-sources/epc-homes.json`), and rewrites `_data/epc-scores.json`. Commit that file. The ratings themselves (`_data/epc.json`) refresh automatically in the monthly workflow. It runs locally rather than in the monthly workflow because it reuses that cache: a few minutes here, against about 40 minutes and 43,600 API calls on a runner that starts with no cache.

          - [ ] **Council tax stock history** — no download: `_data/council-tax-stock-history.json` holds the closed 1993 to 2024 series, and the monthly workflow adds each newer year from the latest VOA snapshot. Check the newest release in the [VOA council tax statistics collection](https://www.gov.uk/government/collections/valuation-office-agency-council-tax-statistics). A normal year lists only a one-year `CTSOP_1_1.zip` (about 4 MB), which the monthly workflow already reads, so there is nothing to do. Only if a release lists a long-run zip named like `CTSOP1-1-1993-YYYY.zip` (over 100 MB), point `SERIES_PAGE_URL` and the zip name in `_python/local/council-tax-stock-history-backfill.py` at it, re-run the script and commit the updated file.
          - [ ] **Bin collections** — no download: check the council's [bank holiday collections page](https://www.cheltenham.gov.uk/bins-and-recycling/check-your-collection-day/bank-holiday-waste-and-recycling-collection/) for new or changed dates and its [what to put in your bin](https://www.cheltenham.gov.uk/bins-and-recycling/what-to-put-in-your-bin/) and garden waste pages for changes to containers, prices or the winter break, then update `_data/bin-collections.json` and set its `last_checked` to today, even if nothing changed. The Week 1/Week 2 weeks refresh themselves weekly.

          - [ ] **Curated lists** — no download: check each list against the groups' and organisers' own sites, and update its JSON for anything added, closed or changed: `_data/clubs.json` (sports clubs, clubs and societies, arts and crafts), `_data/third-spaces.json`, `_data/helpful-contacts.json`, `_data/local-support.json`, `_data/festivals.json` (add the next dates once each festival's own site announces them), `_data/gloucestershire-cricket.json`, `_data/cycle-venues.json` and `_data/ev-charging-additions.json` (EV sites Open Charge Map doesn't list yet: recheck each against its sources, update `last_checked`, and remove any the fetcher reports Open Charge Map now lists). Their pages say "checked monthly". In each file you check, set the top-level `last_checked` to today even if nothing else changed (hq's Data Freshness counts a hand-kept list as fresh from that date). Also act on any additions or corrections sent through the contact form.

          - [ ] **Candidate events** — no download: add events in the next month that the newsletter's feeds miss (gigs, concerts, markets, parties, specific closures or openings) to `_data/candidate-events.json`, each with a date and a link to its own source page. `weekly-newsletter.py` removes past ones by itself.

          Close this issue once done — a new one opens automatically next month.
          EOF

      # Hand-written pages carry a "reviewed:" date in their front matter.
      # Any not reviewed for six months are added to the list above.
      - name: Add hand-written pages due a review
        if: steps.existing.outputs.count == '0'
        run: |
          cutoff=$(date -d '6 months ago' +%F)
          : > due.md
          while IFS= read -r file; do
            reviewed=$(awk '/^---/{n++; next} n==1 && /^reviewed:/{print $2; exit}' "$file")
            [ -n "$reviewed" ] || continue
            if [[ "$reviewed" < "$cutoff" ]]; then
              url=$(awk '/^---/{n++; next} n==1 && /^permalink:/{print $2; exit}' "$file")
              echo "- [ ] **Review [${url}](https://cheltenham-od.uk${url})** — last reviewed ${reviewed}. Check its facts (official source for dates and figures, two sources for supporting facts), fix anything out of date, then set \`reviewed:\` to today in \`${file}\`." >> due.md
            fi
          done < <(find _pages -name '*.md' | sort)
          if [ -s due.md ]; then
            awk 'FNR==NR {due = due $0 "\n"; next} /^Close this issue/ {printf "%s\n", due} {print}' due.md reminder.md > reminder.tmp
            mv reminder.tmp reminder.md
          fi

      # Awareness dates marked provisional and starting in the next three
      # months, plus a nudge from September if next year has no rows yet.
      - name: Add awareness dates to confirm
        if: steps.existing.outputs.count == '0'
        run: |
          python3 - <<'PY' > due.md
          import datetime, json
          today = datetime.date.today()
          horizon = (today + datetime.timedelta(days=92)).isoformat()
          rows = json.load(open("_data/awareness-dates.json"))["observances"]
          for r in rows:
              if r["status"] == "provisional" and today.isoformat() <= r["start"] <= horizon:
                  link = f"[{r['name']}]({r['source_url']})" if r["source_url"] else r["name"]
                  print(f"- [ ] **Confirm {link}** — provisional {r['start']} to {r['end']}. Once the organiser announces the dates, update them in `_data/awareness-dates.json` and set `status` to `confirmed`.")
          next_year = str(today.year + 1)
          if today.month >= 9 and not any(r["start"].startswith(next_year) for r in rows):
              print(f"- [ ] **Add {next_year} awareness dates** — copy each observance into `_data/awareness-dates.json` for {next_year}, using the organiser's announced dates where published and `provisional` estimates otherwise.")
          PY
          if [ -s due.md ]; then
            awk 'FNR==NR {due = due $0 "\n"; next} /^Close this issue/ {printf "%s\n", due} {print}' due.md reminder.md > reminder.tmp
            mv reminder.tmp reminder.md
          fi

      - name: Create reminder issue
        if: steps.existing.outputs.count == '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Monthly Data Refresh Reminder
          content-filepath: ./reminder.md
          labels: data-refresh
