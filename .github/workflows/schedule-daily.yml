---
name: Scheduled Daily
on:
    workflow_dispatch:
    schedule:
        - cron: "47 3,7,13,16 * * *"
permissions:
    contents: write
    pages: write
    id-token: write
    pull-requests: read
    issues: read

jobs:
    build:
        outputs:
            changed: ${{ steps.commit.outputs.changed }}
            ref: ${{ steps.commit.outputs.ref }}
        permissions:
            contents: write
            pull-requests: read
        runs-on: ubuntu-latest
        steps:
            - name: Check out Repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: 3.13.2

            - uses: actions/cache@v6
              name: Configure pip Caching
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('_python/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install Python Dependencies
              run: |
                  python -m pip install -r _python/requirements.txt

            - name: Processing Python Scripts
              env:
                  OPEN_WEATHER_KEY: ${{ secrets.OPEN_WEATHER_KEY }}
                  OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
              run: |-
                  python '_python/forecast.py' || echo "::warning::forecast.py failed, continuing with other scripts"
                  python '_python/flood.py' || echo "::warning::flood.py failed, continuing with other scripts"
                  python '_python/sewage-overflows.py' || echo "::warning::sewage-overflows.py failed, continuing with other scripts"
                  python '_python/terrorism.py' || echo "::warning::terrorism.py failed, continuing with other scripts"
                  python '_python/pharmacy.py' || echo "::warning::pharmacy.py failed, continuing with other scripts"
                  python '_python/post-office.py' || echo "::warning::post-office.py failed, continuing with other scripts"
                  python '_python/toilets.py' || echo "::warning::toilets.py failed, continuing with other scripts"
                  python '_python/weather.py' || echo "::warning::weather.py failed, continuing with other scripts"
                  python '_python/cheltenham-town-fc.py' || echo "::warning::cheltenham-town-fc.py failed, continuing with other scripts"
                  python '_python/roadworks.py' || echo "::warning::roadworks.py failed, continuing with other scripts"
                  python '_python/nhs-ae.py' || echo "::warning::nhs-ae.py failed, continuing with other scripts"
                  python '_python/ev-charging.py' || echo "::warning::ev-charging.py failed, continuing with other scripts"
                  python '_python/traffic.py' || echo "::warning::traffic.py failed, continuing with other scripts"
                  python '_python/sport-fixtures.py' || echo "::warning::sport-fixtures.py failed, continuing with other scripts"

            - name: Commit and push if changed
              id: commit
              run: |-
                  git diff
                  git config user.name "GitHub Action"
                  git config user.email "action@github.com"
                  git add -A

                  if git diff --staged --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git commit -m "Chore: Daily COD Data pull for $(date +'%Y-%m-%d %H:%M')"
                  git push
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    deploy:
        needs: build
        if: needs.build.outputs.changed == 'true'
        uses: ./.github/workflows/deploy-pages.yml
        with:
            ref: ${{ needs.build.outputs.ref }}
        secrets: inherit
