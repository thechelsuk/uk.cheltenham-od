---
name: Refresh 4 Times Daily
on:
    workflow_dispatch:
    # Started at 47 3,7,13,16 * * * UK time by the Pi (_python/pi/crontab.txt), with the
    # Cloudflare watchdog as backup. No GitHub schedule: it ran hours late.
permissions:
    contents: write
    pull-requests: read
    issues: read

jobs:
    build:
        permissions:
            contents: write
            pull-requests: read
        runs-on: ubuntu-latest
        steps:
            - name: Check out Repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - uses: actions/cache@v6
              name: Configure pip Caching
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('_python/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install Python Dependencies
              run: |
                  python -m pip install -r _python/requirements.txt

            - name: Processing Python Scripts
              env:
                  OPEN_WEATHER_KEY: ${{ secrets.OPEN_WEATHER_KEY }}
                  OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
              run: |-
                  python _python/fetch_status.py refresh-4-times-daily _python/forecast.py || echo "::warning::forecast.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/flood.py || echo "::warning::flood.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/wildfire.py || echo "::warning::wildfire.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/school-closures.py || echo "::warning::school-closures.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/fuel-uk-weekly.py || echo "::warning::fuel-uk-weekly.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/terrorism.py || echo "::warning::terrorism.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/pharmacy.py || echo "::warning::pharmacy.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/post-office.py || echo "::warning::post-office.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/toilets.py || echo "::warning::toilets.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/weather.py || echo "::warning::weather.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/ctfc-results.py || echo "::warning::ctfc-results.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/cheltenham-town-fc.py || echo "::warning::cheltenham-town-fc.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/roadworks.py || echo "::warning::roadworks.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/ev-charging.py || echo "::warning::ev-charging.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/site-traffic.py || echo "::warning::site-traffic.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/sport-fixtures.py || echo "::warning::sport-fixtures.py failed, continuing with other scripts"
                  python _python/fetch_status.py refresh-4-times-daily _python/jobs.py || echo "::warning::jobs.py failed, continuing with other scripts"

            # No deploy here: a push from a workflow does not start Pages, so the
            # Pi's next push (every 5 minutes by day, hourly overnight) publishes
            # this commit. Deploying from this run reused the ID of a commit
            # Pages had already deployed, and blocked the push that followed.
            - name: Commit and push if changed
              id: commit
              uses: ./.github/actions/commit-and-push
              with:
                  message: "Chore: Daily COD Data pull for"
