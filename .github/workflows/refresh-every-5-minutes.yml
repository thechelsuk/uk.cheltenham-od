---
name: Refresh Every 5 Minutes (Pi Fallback)
on:
    workflow_dispatch:

concurrency:
    group: alerts
    cancel-in-progress: false

permissions:
    contents: write
    pages: write
    id-token: write
    # To find the last successful deploy, for IndexNow.
    deployments: read
    pull-requests: read
    issues: read

jobs:
    build:
        outputs:
            changed: ${{ steps.commit.outputs.changed }}
            ref: ${{ steps.commit.outputs.ref }}
        permissions:
            contents: write
            pull-requests: read
        runs-on: ubuntu-latest
        steps:
            - name: Check out Repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - uses: actions/cache@v6
              name: Configure pip Caching
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('_python/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install Python Dependencies
              run: |
                  python -m pip install -r _python/requirements.txt

            # Stand-in for the Raspberry Pi: runs the scripts in the Pi's
            # manifests (_python/pi/every-5-minutes.txt and hourly.txt), the
            # same lists its cron reads, for when the Pi is down (a power cut,
            # say). Manual only, so it can be started from a phone and stopped
            # once the Pi is back; running both at once just makes duplicate commits.
            - name: Processing Python Scripts
              env:
                  FUEL_KEY: ${{ secrets.FUEL_KEY }}
                  FUEL_TOKEN: ${{ secrets.FUEL_TOKEN }}
                  NAT_HIGH_KEY: ${{ secrets.NAT_HIGH_KEY }}
                  RDM_LDBWS_KEY: ${{ secrets.RDM_LDBWS_KEY }}
              run: |-
                  scripts="$(bash _python/run.sh --list every-5-minutes hourly)"
                  while IFS= read -r script; do
                      python _python/fetch_status.py pi "$script" || echo "::warning::$script failed, continuing with other scripts"
                  done <<< "$scripts"

            - name: Commit and push if changed
              id: commit
              uses: ./.github/actions/commit-and-push
              with:
                  message: "Chore: Alerts data pull for"

    deploy:
        needs: build
        if: needs.build.outputs.changed == 'true'
        uses: ./.github/workflows/deploy-pages.yml
        with:
            ref: ${{ needs.build.outputs.ref }}
        secrets: inherit
