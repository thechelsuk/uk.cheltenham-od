name: "IndexNow Submit"
description: "Tell IndexNow (Bing, Yandex, Seznam, Naver, etc.) which pages are new or have changed"

inputs:
  site-url:
    description: "Base URL of the deployed site, e.g. https://example.com"
    required: true
  key:
    description: "IndexNow API key string"
    required: true
  urls:
    description: "The new or changed page URLs, as a JSON list (from _python/indexnow-urls.py)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Submit URLs to IndexNow
      shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
        INDEXNOW_KEY: ${{ inputs.key }}
        URLS_JSON: ${{ inputs.urls }}
      run: |
        set -euo pipefail

        HOST=$(echo "$SITE_URL" | sed -E 's~https?://([^/]+).*~\1~')

        PAYLOAD=$(jq -n --arg host "$HOST" --arg key "$INDEXNOW_KEY" --argjson urls "$URLS_JSON" \
          '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}')

        echo "Submitting $(jq 'length' <<< "$URLS_JSON") URLs to IndexNow:"
        jq -r '.[]' <<< "$URLS_JSON"

        HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d "$PAYLOAD")

        echo "Response HTTP $HTTP_STATUS:"
        cat response.txt

        if [ "$HTTP_STATUS" -ge 400 ]; then
          echo "::error::IndexNow submission failed with status $HTTP_STATUS"
          exit 1
        fi

        echo "IndexNow submission succeeded."
