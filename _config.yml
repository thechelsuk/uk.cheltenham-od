highlighter: rouge
permalink: ./:title
timezone: Europe/London
title: "Cheltenham Open Data"
description: "Local Data for Local People in Cheltenham and Gloucestershire"
author: "thechelsuk"
url: https://cheltenham-od.uk
icon: "/assets/images/apple-touch-icon.png"
copyright: "Cheltenham Open Data — site, content, code and compilation &copy; Cheltenham Open Data, all rights reserved."
disclaimer: "Underlying data &copy; respective providers, used under licence. No liability accepted for data accuracy."
encoding: UTF-8
future: false
repository: thechelsuk/uk.cheltenham-od
defaultImagePath: "/assets/images/apple-touch-icon.png"
github:
  repository_url: https://github.com/thechelsuk/uk.cheltenham-od
  branch: main
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-avatar
  - jekyll-github-metadata
exclude:
  - CNAME
  - README.md
  - LICENSE.md
  - SECURITY.md
  - _python/
  - .github/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
include:
  - ".well-known"
  - "_pages"

# --- Classifieds / adverts section. ---
collections:
  classifieds:
    output: true
    permalink: /ads/:title/
  newsletters:
    output: true
    permalink: /newsletter/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: ./news/:title
      parent: /news
      author: Mat Benfield
      author_url: /about
  - scope:
      path: ""
      type: classifieds
    values:
      layout: about-info/advert
      robots: "noindex"
      parent: /cheltenham-classifieds
  - scope:
      path: ""
      type: newsletters
    values:
      layout: site/newsletter-issue
      type: "cod"
      parent: /newsletter
  - scope:
      path: "_pages/about-info/wards"
    values:
      parent: /cheltenham-wards
  - scope:
      path: "_pages/about-info/news-pages"
    values:
      parent: /cheltenham-news

classified_categories:
  - value: "jobs"
    label: "Jobs"
    description: "Local jobs, employment, vacancies, and opportunities, including new vacancies within five miles of Cheltenham from GOV.UK's job search, each listed for a week."
  - value: "services"
    label: "Services"
    description: ""
  - value: "for-sale"
    label: "For sale"
    description: "Private item sales or free items"
  - value: "property"
    label: "Property"
    description: "Private property sales, lets and places to rent etc"
  - value: "community"
    label: "Community notices"
    description: "Local community events and notices"
  - value: "wanted"
    label: "Wanted"
    description: "Wanted items to purchase or collect for free"
  - value: "digital"
    label: "Digital"
    description: "Sites, applications, mobile apps, Software as a Service (SaaS) products"

feed:
  collections:
    posts:
      path: "/feeds/main.xml"
    classifieds:
      path: "/feeds/classifieds.xml"

# Site navigation: the menu, category pages and breadcrumbs are built from
# _data/navigation/*.yml by _plugins/navigation.rb.

# Full-width heading, links split into 4 even columns underneath at render
# time (see _includes/footer.html) — one list, so it stays self-sorting as
# pages are added instead of needing hand-split sub-lists kept in balance.
footer_pages:
  title: "Cheltenham Pages (A-Z)"
  # links: every menu entry, sub-pages marked `a_z: true` and section pages,
  # by short name and already sorted, filled in by _plugins/navigation.rb.

newsletter:
  name: "The Cheltenham Week Ahead"
  tagline: "A short Cheltenham briefing every Monday morning, starting soon: the week's weather, roadworks, events and top local stories."
  buttondown_username: "CheltenhamOD"

# Every Atom feed the site publishes, for the /feeds page and the press page.
# `key: true` marks the few the press page lists; the footer's Feeds column
# links those by hand, plus /feeds.
feeds:
  - name: Our Feed
    link: /feeds/main.xml
    group: From Cheltenham Open Data
    key: true
    description: "New pages, site announcements and our own analysis of local data."
  - name: Cheltenham Classifieds
    link: /feeds/classifieds.xml
    group: From Cheltenham Open Data
    description: "New classified adverts from local people and businesses."
  - name: Daily News Summary
    link: /feeds/news-summary.xml
    group: Local News
    key: true
    description: "One round-up a day of the top local headlines."
  - name: Breaking News
    link: /feeds/news-breaking.xml
    group: Local News
    key: true
    description: "Every local headline from Cheltenham news, council, police and community sources, as it is picked up."
  - name: Cheltenham Alerts, All in One
    link: /feeds/alerts.xml
    group: Alerts
    key: true
    description: "Flood warnings, power cuts, bus disruptions, wildfire risk, road closures and threat level changes in one feed."
  - name: Flood Warnings
    link: /feeds/flood.xml
    group: Alerts
    description: "Current and recent Environment Agency flood warnings for Gloucestershire."
  - name: Power Cuts
    link: /feeds/power-cuts.xml
    group: Alerts
    description: "Live and recent power cuts affecting Cheltenham postcodes."
  - name: Bus Disruptions
    link: /feeds/bus-disruptions.xml
    group: Alerts
    description: "Current and recent bus service disruptions affecting Cheltenham."
  - name: Wildfire Risk
    link: /feeds/wildfire.xml
    group: Alerts
    description: "Days forecast at high, very high or exceptional fire severity around Cheltenham."
  - name: Unplanned Road Closures
    link: /feeds/unplanned-closures.xml
    group: Alerts
    description: "Unplanned lane and road closures on the M5, A417, A40 and A46 near Cheltenham."
  - name: UK Threat Level
    link: /feeds/security.xml
    group: Alerts
    description: "Changes to the UK national terrorism threat level, from MI5."

# The four columns under the Pages (A-Z) block: Guides, Feeds, About, Meta.
footer_columns:
  - title: Guides
    links:
      - name: Moving to Cheltenham
        link: /moving-to-cheltenham
      - name: Studying in Cheltenham
        link: /student-guide-to-cheltenham
      - name: Horse racing in Cheltenham
        link: /cheltenham-festival-accommodation
      - name: Visiting Cheltenham
        link: /visiting-cheltenham
      - name: All Guides
        link: /guides

  - title: Feeds
    links:
      - name: Our Feed (atom)
        link: /feeds/main.xml
      - name: Cheltenham Alerts, All in One (atom)
        link: /feeds/alerts.xml
      - name: Daily News Summary (atom)
        link: /feeds/news-summary.xml
      - name: Breaking News (atom)
        link: /feeds/news-breaking.xml
      - name: All Feeds
        link: /feeds

  - title: About
    links:
      - name: Site News
        link: /news
      - name: Weekly Newsletter
        link: /newsletter
      - name: About
        link: /about
      - name: Press
        link: /press
      - name: Contact
        link: /contact
      - name: Sponsorship
        link: /sponsor

  - title: Meta
    links:
      - name: Terms &amp; Conditions
        link: /terms
      - name: Privacy Policy
        link: /privacy
      - name: Editorial Standards
        link: /editorial-standards
      - name: Data Widgets
        link: /widgets
      - name: All Policies &amp; Site Files
        link: /policies

social:
  linkedin: "https://www.linkedin.com/company/cheltenham-open-data/"
  instagram: "https://www.instagram.com/cheltenhamod"
  bluesky: "https://bsky.app/profile/cheltenham-od.uk"
  mastodon: "https://mastodon.social/@CheltenhamOD"
  threads: "https://www.threads.com/@cheltenhamod"
  github: "https://github.com/thechelsuk"
  kofi: "https://ko-fi.com/thechelsuk"
  nextdoor: "https://nextdoor.co.uk/page/cheltenham-open-data-cheltenham-england"

sponsor:
  url: "/sponsor"
  logo: "/assets/images/sponsors/logo.png"
  name: "Your Local Business Here  - 01242 000000"
  tagline: "Sponsor your category with your local business — from £100/m as a founding sponsor →"
