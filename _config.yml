highlighter: rouge
permalink: ./:title
timezone: Europe/London
title: "Cheltenham Open Data"
description: "Local Data for Local People in Cheltenham and Gloucestershire"
author: "thechelsuk"
url: https://cheltenham-od.uk
icon: "/assets/images/logo.png"
copyright: "Cheltenham Open Data — site, content, code and compilation &copy; Cheltenham Open Data, all rights reserved."
disclaimer: "Underlying data &copy; respective providers, used under licence. No liability accepted for data accuracy."
encoding: UTF-8
future: false
repository: thechelsuk/uk.thechels.cod
defaultImagePath: "/assets/images/logo.png"
github:
  repository_url: https://github.com/thechelsuk/uk.cheltenham-od
  branch: main
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-avatar
  - jekyll-github-metadata
exclude:
  - CNAME
  - README.md
  - LICENSE.md
  - SECURITY.md
  - _python/
  - .github/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
include:
  - ".well-known"
  - "_pages"
  - ads.txt

# --- Classifieds / adverts section. ---
collections:
  classifieds:
    output: true
    permalink: /ads/:title/
  events:
    output: true
    permalink: /events/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: ./news/:title
  - scope:
      path: ""
      type: classifieds
    values:
      layout: advert
      robots: "noindex"

classified_categories:
  - value: "jobs"
    label: "Jobs"
    description: "Local jobs, employment, vacancies, and opportunities"
  - value: "services"
    label: "Services"
    description: ""
  - value: "for-sale"
    label: "For sale"
    description: "Private item sales or free items"
  - value: "property"
    label: "Property"
    description: "Private property sales, lets and places to rent etc"
  - value: "community"
    label: "Community notices"
    description: "Local community events and notices"
  - value: "wanted"
    label: "Wanted"
    description: "Wanted items to purchase or collect for free"
  - value: "digital"
    label: "Digital"
    description: "Websites, applications, mobile apps, Software as a Service (SaaS) products"

feed:
  collections:
    posts:
      path: "/feeds/main.xml"
    classifieds:
      path: "/feeds/classifieds.xml"
    events:
      path: "/feeds/events.xml"

