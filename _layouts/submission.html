{% include header.html %}

<div class="{{page.type}} herobar">
    <header class="{{page.type}} header">
        <h1>{{page.title}}</h1>
        <p>{{page.description}}</p>
    </header>

    <div class="contact-form-wrapper">
        <form method="POST" action="https://api.cheltenham-od.uk/submission" class="contact-form" id="contact-form">

            <div class="form-field">
                <label for="name">Your full name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-field">
                <label for="email">Your email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-field">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Choose a category…</option>
                    {%- for category in site.classified_categories -%}
                    <option value="{{ category.value }}">{{ category.label }}</option>
                    {%- endfor -%}

                </select>
            </div>


            <div class="form-field">
                <label for="title">Advert title</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-field">
                <label for="company">Advertiser / business name <span class="optional">(optional)</span></label>
                <input type="text" id="company" name="company">
            </div>

            <div class="form-field">
                <label for="location">Location <span class="optional">(optional)</span></label>
                <input type="text" id="location" name="location" placeholder="e.g. Cheltenham, GL50">
            </div>

            <div class="form-field">
                <label for="salary">Salary / price <span class="optional">(optional)</span></label>
                <input type="text" id="salary" name="salary" placeholder="e.g. £12.21/hour, £250 ono">
            </div>

            <div class="form-field">
                <label for="job_type">Type <span class="optional">(optional)</span></label>
                <input type="text" id="job_type" name="job_type" placeholder="e.g. Part-time, Full-time, Contract">
            </div>

            <div class="form-field">
                <label for="description">Advert details</label>
                <textarea id="description" name="description" rows="8" required></textarea>
            </div>

            <div class="form-field">
                <label for="apply_url">Apply / contact link <span class="optional">(optional)</span></label>
                <input type="url" id="apply_url" name="apply_url" placeholder="https://…">
            </div>

            <div class="form-field">
                <label for="expires">Closing date <span class="optional">(optional)</span></label>
                <input type="date" id="expires" name="expires">
            </div>

            <!-- Honeypot: hidden from real users, often filled by bots -->
            <input type="text" name="_gotcha" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">

            <!-- Time trap -->
            <input type="hidden" name="_ts" id="form-ts">

            <!-- Turnstile widget -->
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEV05i6GL7gxLCpd"></div>
            <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

            <button type="submit" class="submit-btn">Submit advert</button>
        </form>
    </div>

    <style>
        .contact-form-wrapper {
            max-width: 832px;
            margin: 2em auto;
            font-family: var(--font-stack);
            color: var(--primary);
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.25em;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 0.4em;
        }

        .form-field label {
            font-family: var(--header-stack);
            font-size: 0.9em;
            color: var(--primary);
        }

        .form-field .optional {
            font-weight: normal;
            color: var(--text-muted);
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 0.6em 0.8em;
            border: 1px solid var(--tab);
            border-radius: 4px;
            font-size: 1em;
            font-family: var(--font-stack);
            color: var(--primary);
            background-color: var(--alt-tab);
            transition: var(--trans);
        }

        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px var(--code);
        }

        .form-field textarea {
            resize: vertical;
            min-height: 120px;
            font-family: var(--font-stack);
        }

        /* Honeypot — visually hidden but not display:none,
     since some spam bots skip display:none fields */
        .hp-field {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .submit-btn {
            align-self: flex-start;
            padding: 0.6em 1.6em;
            background: var(--secondary);
            color: #14171a;
            border: 1px solid var(--secondary);
            border-radius: 4px;
            font-family: var(--header-stack);
            font-size: 1em;
            cursor: pointer;
            transition: var(--trans);
        }

        .submit-btn:hover,
        .submit-btn:focus {
            background: var(--accent-hover, var(--accent-dark));
            border-color: var(--accent-hover, var(--accent-dark));
            color: var(--accent-text);
        }

        .submit-btn:active {
            background: var(--accent-hover, var(--accent-dark));
            border-color: var(--accent-hover, var(--accent-dark));
        }

        @media only screen and (max-width: 540px) {
            .submit-btn {
                align-self: stretch;
                text-align: center;
            }
        }
    </style>


    <script>
        document.getElementById('form-ts').value = Date.now();
    </script>

    {% include footer.html %}
