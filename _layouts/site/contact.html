{% include header.html %}

<div class="{{page.type}} herobar">
    <header class="{{page.type}} header">
        {% include breadcrumbs.html %}
        <h1>{{page.title}}</h1>
        <p>{{page.description}}</p>
    </header>
    {% include section-links.html %}

    {{ content }}

    <div class="contact-form-wrapper">
        <form method="POST" action="https://api.cheltenham-od.uk/contact" class="contact-form" id="contact-form">

            <div class="form-field">
                <label for="name">Your full name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-field">
                <label for="email">Your email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-field">
                <label for="message">Message details</label>
                <textarea id="message" name="message" rows="8" required></textarea>
            </div>

            <!-- Honeypot: hidden from real users, often filled by bots -->
            <input type="text" name="_gotcha" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">

            <!-- Time trap -->
            <input type="hidden" name="_ts" id="form-ts">

            <!-- Turnstile widget -->
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEV0ze4eR2NZfnRc"></div>
            <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

            <button type="submit" class="submit-btn">Send message</button>
        </form>
    </div>



    <script>
        document.getElementById('form-ts').value = Date.now();
    </script>

    {% include footer.html %}
