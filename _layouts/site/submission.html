{% include header.html %}

<div class="{{page.type}} herobar">
    <header class="{{page.type}} header">
        {% include breadcrumbs.html %}
        <h1>{{page.title}}</h1>
        <p>{{page.description}}</p>
    </header>
    {% include section-links.html %}

    <div class="contact-form-wrapper">
        <form method="POST" action="https://api.cheltenham-od.uk/submission" class="contact-form" id="contact-form">

            <div class="form-field">
                <label for="name">Your full name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-field">
                <label for="email">Your email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-field">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Choose a category…</option>
                    {%- for category in site.classified_categories -%}
                    <option value="{{ category.value }}">{{ category.label }}</option>
                    {%- endfor -%}

                </select>
            </div>


            <div class="form-field">
                <label for="title">Advert title</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-field">
                <label for="company">Advertiser / business name <span class="optional">(optional)</span></label>
                <input type="text" id="company" name="company">
            </div>

            <div class="form-field">
                <label for="location">Location <span class="optional">(optional)</span></label>
                <input type="text" id="location" name="location" placeholder="e.g. Cheltenham, GL50">
            </div>

            <div class="form-field">
                <label for="salary">Salary / price <span class="optional">(optional)</span></label>
                <input type="text" id="salary" name="salary" placeholder="e.g. £12.21/hour, £250 ono">
            </div>

            <div class="form-field">
                <label for="job_type">Type <span class="optional">(optional)</span></label>
                <input type="text" id="job_type" name="job_type" placeholder="e.g. Part-time, Full-time, Contract">
            </div>

            <div class="form-field">
                <label for="description">Advert details</label>
                <textarea id="description" name="description" rows="8" required></textarea>
            </div>

            <div class="form-field">
                <label for="apply_url">Apply / contact link <span class="optional">(optional)</span></label>
                <input type="url" id="apply_url" name="apply_url" placeholder="https://…">
            </div>

            <div class="form-field">
                <label for="expires">Closing date <span class="optional">(optional)</span></label>
                <input type="date" id="expires" name="expires">
            </div>

            <!-- Honeypot: hidden from real users, often filled by bots -->
            <input type="text" name="_gotcha" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">

            <!-- Time trap -->
            <input type="hidden" name="_ts" id="form-ts">

            <!-- Turnstile widget -->
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEV05i6GL7gxLCpd"></div>
            <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

            <button type="submit" class="submit-btn">Submit advert</button>
        </form>
    </div>



    <script>
        document.getElementById('form-ts').value = Date.now();
    </script>

    {% include footer.html %}
