{% include header.html %}
<div class="{{page.type}} herobar">
    <div class="{{page.type}}">
        <header class="{{page.type}} header">
            <h1>{{page.title}}</h1>
            <p>{{page.description}}</p>
            <ul>
                <li><a href="/newsletter">&larr; Newsletter archive</a></li>
            </ul>
        </header>

        {% include sponsor.html %}

        <p>
            <button type="button" id="newsletter-copy-btn" class="button">Copy for Buttondown</button>
            <span id="newsletter-copy-status" role="status" hidden></span>
        </p>

        <div id="newsletter-body">
            {{ content }}
        </div>

        <h2>Get This Every Monday</h2>
        {% include newsletter-signup.html source="issue-page" %}
    </div>
</div>
<script src="/assets/scripts/newsletter-copy.js"></script>
{% include footer.html %}
