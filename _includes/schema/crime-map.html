<script type="application/ld+json">

    {
      "@type": "Question",
      "name": "How Is the Crime Rate Worked Out?",
      "acceptedAnswer": { "@type": "Answer", "text": "We count every street-level crime published by Police.uk within an area's boundary over 12 months, then divide by the number of people living there and multiply by 1,000. Population figures are the Office for National Statistics' mid-year estimates for the year each 12-month period ends in, or the latest year published." }
    },
    {
      "@type": "Question",
      "name": "What Are the Small Areas?",
      "acceptedAnswer": { "@type": "Answer", "text": "They are the Office for National Statistics' Lower Layer Super Output Areas, small neighbourhoods of roughly 1,000 to 3,000 residents used for census and official statistics. Each is named after the borough and a code, such as Cheltenham 004D, and the table shows which ward each one mostly falls in." }
    },
    {
      "@type": "Question",
      "name": "Why Does the Town Centre Have Such a High Rate?",
      "acceptedAnswer": { "@type": "Answer", "text": "Crime rates are measured against the people who live in an area, but the town centre is where many more people shop, work and go out. Violence, anti-social behaviour and shoplifting, the most common crimes in the centre, push its rate up even though relatively few people live there." }
    },
    {
      "@type": "Question",
      "name": "Why Might a Crime Appear in the Wrong Area?",
      "acceptedAnswer": { "@type": "Answer", "text": "Police.uk moves each crime to a nearby anonymous map point to protect the privacy of victims, so a crime near a boundary can be counted on the other side of it. Treat the map as a guide to how areas compare rather than an exact count for any one street." }
    },
    {
      "@type": "Question",
      "name": "Which Months Does the Map Cover?",
      "acceptedAnswer": { "@type": "Answer", "text": "Each view covers 12 complete months of published data. Police.uk usually publishes each month's figures early in the month after next, and any month the police have not yet published in full is left out until it is." }
    }
  ]
