{% assign ae = site.data["nhs-ae"] %}
{% assign hospitals = site.data["nhs-hospitals"] %}
{% assign oldest = ae.months | last %}
{% assign newest = ae.months | first %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "{{ ae.trust.name }} A&E Waiting Times",
  "description": "Monthly A&E attendances, four-hour performance, 12-hour waits from decision to admit and emergency admissions for {{ ae.trust.name }}, which runs Cheltenham General Hospital, from NHS England, with a map of the trust's hospitals near Cheltenham.",
  "url": "{{ page.url | absolute_url }}",
  "dateModified": "{{ ae.generated_at }}",
  "temporalCoverage": "{{ oldest.period }}/{{ newest.period }}",
  "isAccessibleForFree": true,
  "license": "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/",
  "creator": { "@type": "Organization", "name": "{{ site.title }}", "url": "{{ site.url }}" },
  "spatialCoverage": { "@type": "Place", "name": "Cheltenham, Gloucestershire, UK" },
  "variableMeasured": ["Month", "A&E attendances", "Seen within 4 hours", "Attendances over 4 hours", "Waited 12 hours or more from decision to admit", "Emergency admissions", "Hospital name", "Address", "Location"]
}
</script>
