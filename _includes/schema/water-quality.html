    { "@type": "Question", "name": "What is a \"determinand\"?", "acceptedAnswer": {"@type": "Answer", "text": "The Environment Agency's term for a specific substance or property measured in a water sample — pH, temperature, or the concentration of a particular chemical like nitrate. Each sampling visit tests a batch of them at once, which is why one visit produces many rows on the table above."} },
    { "@type": "Question", "name": "What do the common determinands mean?", "acceptedAnswer": {"@type": "Answer", "text": "pH is how acidic or alkaline the water is, on a 0-14 scale; most healthy rivers sit around neutral, roughly 6.5-8.5. Temperature of Water is in degrees Celsius; sustained high temperatures can lower how much oxygen the water holds. Oxygen, Dissolved as O2 / % Saturation is how much oxygen is available for fish and other aquatic life; low values can indicate pollution or algal blooms. Ammoniacal Nitrogen as N / Ammonia un-ionised as N is nitrogen from sources like sewage or agricultural runoff; higher levels can be toxic to fish. Nitrate as N / Nitrite as N / Nitrogen, Total Oxidised as N are other nitrogen compounds, often from fertiliser runoff or treated sewage effluent. Orthophosphate, reactive as P / Phosphorus, Total as P are phosphorus compounds, a common cause of excessive plant and algae growth when levels are high. BOD : 5 Day ATU (Biochemical Oxygen Demand) is how much oxygen microorganisms use breaking down organic matter in the sample over 5 days; a higher figure suggests more organic pollution. Conductivity at 25 C is how well the water conducts electricity, a general indicator of dissolved mineral/salt content. Metals (Cadmium, Lead, Nickel, etc), Chloride, Calcium, Magnesium, Silica and Suspended Solids are also routinely tested for; specialist reference values exist for each but are outside the scope of this page."} },
    { "@type": "Question", "name": "What does a value like \"<0.03\" mean?", "acceptedAnswer": {"@type": "Answer", "text": "The substance was tested for but not detected above the laboratory's detection limit — the true value is somewhere below the number shown, not exactly that number."} },
    { "@type": "Question", "name": "What about \"GCMS Screen\", \"LCMS Screen\" or \"Non Target Screening\"?", "acceptedAnswer": {"@type": "Answer", "text": "These are broad laboratory screening tests for a wide range of chemicals at once (pesticides, industrial compounds and similar), reported as \"Semi Quantitative\" or a plain presence/absence result rather than a single concentration value — hence values like \"1\" with a unit of \"Text\"."} },
    { "@type": "Question", "name": "Where does the data come from?", "acceptedAnswer": {"@type": "Answer", "text": "The Environment Agency's Water Quality Archive, released under the Open Government Licence v3.0."} }
  ]
