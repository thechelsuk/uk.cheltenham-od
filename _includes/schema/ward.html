{% assign w = site.data.wards[page.ward] %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "{{ w.name }} Ward, Cheltenham: Local Data Profile",
  "description": "Crime, house prices, broadband and the nearest local services for {{ w.name }} ward in Cheltenham, drawn from open data and placed by location.",
  "url": "{{ page.url | absolute_url }}",
  "dateModified": "{{ w.generated_at }}",
  "isAccessibleForFree": true,
  "license": "https://www.nationalarchives.gov.uk/doc/open-government-licence/",
  "creator": { "@type": "Organization", "name": "{{ site.title }}", "url": "{{ site.url }}" },
  "spatialCoverage": { "@type": "Place", "name": "{{ w.name }} ward, Cheltenham, Gloucestershire, UK", "geo": { "@type": "GeoCoordinates", "latitude": {{ w.centre.lat }}, "longitude": {{ w.centre.lon }} } },
  "variableMeasured": ["Crimes reported", "House sale prices", "Broadband coverage", "Councillors and election results", "Health services", "Schools", "Parks and play areas", "Public toilets"]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    { "@type": "Question", "name": "Where Does the {{ w.name }} Data Come From?", "acceptedAnswer": {"@type": "Answer", "text": "Crime is street-level data from data.police.uk. House prices are HM Land Registry Price Paid data. Election results and councillors are from Cheltenham Borough Council. Broadband is from Ofcom's Connected Nations, and ward boundaries are from the Office for National Statistics. Everything else comes from the same open datasets behind the rest of this site, such as the NHS, the Food Standards Agency, Historic England and OpenStreetMap, sorted into the ward by location."} },
    { "@type": "Question", "name": "How Accurate Is the Ward Boundary?", "acceptedAnswer": {"@type": "Answer", "text": "The boundary is a simplified version of the official ward outline, so a place right on the edge of the ward may be counted on either side. Where a service sits just outside the boundary it is listed as nearby, with its distance from the middle of the ward."} },
    { "@type": "Question", "name": "Does the Crime Count Show How Safe the Ward Is?", "acceptedAnswer": {"@type": "Answer", "text": "Not on its own. The figures are reports recorded by the police, they don't allow for the number of people living in or passing through the ward, and police record crimes against the nearest street point rather than the exact location. Use them to compare one year with another and one type of crime with another."} }
  ]
}
</script>
