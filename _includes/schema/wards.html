{% assign data = site.data.wards.index %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "Cheltenham Wards: Crime, House Prices and Broadband by Ward",
  "description": "Crime reports, median house prices, broadband coverage, listed buildings, electorate and councillors for each of Cheltenham's {{ data.wards.size }} electoral wards, with ward boundaries.",
  "url": "{{ page.url | absolute_url }}",
  "dateModified": "{{ data.generated_at }}",
  "isAccessibleForFree": true,
  "license": "https://www.nationalarchives.gov.uk/doc/open-government-licence/",
  "creator": { "@type": "Organization", "name": "{{ site.title }}", "url": "{{ site.url }}" },
  "spatialCoverage": { "@type": "Place", "name": "Cheltenham, Gloucestershire, UK" },
  "variableMeasured": ["Postcodes", "Area", "Crimes reported", "Median house sale price", "Gigabit broadband coverage", "Listed buildings", "Registered voters", "Election turnout", "Councillors"]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    { "@type": "Question", "name": "What Is a Ward?", "acceptedAnswer": {"@type": "Answer", "text": "A ward is the area a councillor is elected to represent. Councils, the police and the Office for National Statistics all publish figures by ward, which makes wards a convenient way to compare one part of a town with another."} },
    { "@type": "Question", "name": "Why Are Some Wards Recording More Crime?", "acceptedAnswer": {"@type": "Answer", "text": "The table shows the number of crimes reported, not the rate per resident. Wards that include the town centre have many visitors, shops and licensed premises, so they tend to record more crime than mainly residential wards, and wards also differ a lot in size."} },
    { "@type": "Question", "name": "Where Does the Ward Data Come From?", "acceptedAnswer": {"@type": "Answer", "text": "Crime is street-level data from data.police.uk, election results and councillors are from Cheltenham Borough Council, house prices are HM Land Registry Price Paid data, broadband is from Ofcom's Connected Nations and ward boundaries are from the Office for National Statistics, all under the Open Government Licence. Each ward profile adds services from the NHS, Historic England, the Food Standards Agency and OpenStreetMap."} }
  ]
}
</script>
