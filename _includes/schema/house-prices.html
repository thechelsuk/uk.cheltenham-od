<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "{{ page.title }}",
  "description": "{{ page.description }}",
  "url": "{{ page.url | absolute_url }}",
  "isAccessibleForFree": true,
  "license": "https://www.nationalarchives.gov.uk/doc/open-government-licence/",
  "creator": { "@type": "Organization", "name": "{{ site.title }}", "url": "{{ site.url }}" },
  "spatialCoverage": { "@type": "Place", "name": "Cheltenham, Gloucestershire, UK" },
  "temporalCoverage": "{% if page.pyear %}{{ page.pyear }}{% else %}{{ page['available-years'] | sort | first }}/{{ page['available-years'] | sort | last }}{% endif %}",
  "variableMeasured": ["Sale price", "Sale date", "Property type", "Postcode"]
}
</script>
