    { "@type": "Question", "name": "What counts as an employee job?", "acceptedAnswer": {"@type": "Answer", "text": "The Business Register and Employment Survey counts jobs held by employees in registered businesses, in the place the job is based, whether or not the person lives in Cheltenham. It does not include the self-employed, and the published figures are rounded, which is why smaller industries show round numbers."} },
    { "@type": "Question", "name": "What does the comparison with England mean?", "acceptedAnswer": {"@type": "Answer", "text": "It divides an industry's share of jobs in Cheltenham by its share of jobs across England. A figure of 1.00 means the same share, 1.50 means one and a half times the national share, and 0.50 means half."} },
    { "@type": "Question", "name": "Which businesses are counted?", "acceptedAnswer": {"@type": "Answer", "text": "Businesses registered for VAT and, or, PAYE. Very small businesses that are below the VAT threshold and have no employees on PAYE are not included, so the true number of businesses, including sole traders, is higher."} },
    { "@type": "Question", "name": "What is the Claimant Count?", "acceptedAnswer": {"@type": "Answer", "text": "The number of people claiming Jobseeker's Allowance or the part of Universal Credit that is paid because someone is out of work or on a low income and required to look for work. It is a measure of benefit claims, not the official unemployment rate, and the roll-out of Universal Credit between 2013 and 2018 raised it without a matching rise in unemployment."} },
    { "@type": "Question", "name": "Where does this data come from?", "acceptedAnswer": {"@type": "Answer", "text": "The Office for National Statistics, through Nomis. Jobs and businesses are published once a year and the claimant count monthly, and this page is refreshed monthly."} }
