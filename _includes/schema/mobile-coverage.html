      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Indoor and outdoor coverage are both measured at premises (homes and businesses) — indoor is the harder test, since walls, insulation and modern double glazing all weaken a signal. \"Local area\" (Ofcom calls this \"geographic\" coverage) is different: it's the percentage of the physical land area with a predicted signal, including fields, roads and open spaces between buildings, not just where people live and work."
      }

    {
      "@type": "Question",

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It means at least one of EE, O2, Three or Vodafone is predicted to reach that location — not necessarily the network on your SIM. If your specific network shows gaps, a different provider might still work well in the same spot."
      }

      "@type": "Question",

        "@type": "Answer",
        "text": "Ofcom's own guidance lists several reasons real-world signal can differ from the prediction: how far you are from the nearest mast, hills, trees and buildings in the way, how busy the local mast is at that moment, the materials your building or vehicle is made from, bad weather, and even the quality of your phone's own antenna."
      }
