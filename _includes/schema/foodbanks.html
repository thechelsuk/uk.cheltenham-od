<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "Food Banks Near Cheltenham",
  "description": "Food banks within ten miles of Cheltenham town centre, with the items they need, donation points and contact details, from Give Food.",
  "url": "{{ page.url | absolute_url }}",
  "dateModified": "{{ site.data['foodbank'].generated_at }}",
  "isAccessibleForFree": true,
  "license": "{{ site.data['foodbank'].licence_url }}",
  "creator": { "@type": "Organization", "name": "{{ site.title }}", "url": "{{ site.url }}" },
  "isBasedOn": "{{ site.data['foodbank'].source_url }}",
  "spatialCoverage": { "@type": "Place", "name": "Cheltenham, Gloucestershire, UK" },
  "variableMeasured": ["Food bank", "Network", "Distance", "Items requested", "Donation points", "Contact details"]
}
</script>
