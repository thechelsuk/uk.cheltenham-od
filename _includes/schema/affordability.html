    {"@type": "Question", "name": "How Is \"Affordable\" Worked Out?", "acceptedAnswer": {"@type": "Answer", "text": "A home sale counts as affordable when its price is no more than 4.5 times the median gross annual pay of full-time workers who live in Cheltenham that year. 4.5 times pay is roughly the most a lender will usually offer one borrower."}},
    {"@type": "Question", "name": "Does It Allow for a Deposit or Household Income?", "acceptedAnswer": {"@type": "Answer", "text": "No. It uses one typical income and doesn't allow for a deposit, other debts or the mortgage rate. Two earners, a large deposit or help from family would put more homes in reach, and no deposit, or a higher interest rate, would put fewer."}},
    {"@type": "Question", "name": "Why Do Flats Look So Different From Houses?", "acceptedAnswer": {"@type": "Answer", "text": "Flats sell for far less than houses in Cheltenham, so a much larger share of them fall under the price limit. Detached homes sell for much more, so almost none do."}},
    {"@type": "Question", "name": "Why Does the Share Jump Between Some Years?", "acceptedAnswer": {"@type": "Answer", "text": "Both sales and pay change from year to year. Pay comes from a survey each April, so a big move in one year's estimate shows up straight away in the price limit, and the mix of homes that happen to sell also shifts. Look at the trend over several years rather than any single year."}},
    {"@type": "Question", "name": "Where Does the Data Come From?", "acceptedAnswer": {"@type": "Answer", "text": "Sales are HM Land Registry Price Paid Data for Cheltenham, and pay is the ONS Annual Survey of Hours and Earnings for residents of the borough. The page is refreshed monthly, and a year is added once it has finished and its pay figure has been published."}},
    {"@type": "Question", "name": "Can I Compare It With the ONS Affordability Ratio?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. The ONS publishes a house price to earnings ratio for every local authority, which is a single number for the whole market. This page shows the same picture as a share of the homes actually sold."}}
