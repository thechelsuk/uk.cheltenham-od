<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "{{ page.title }}",
  "description": "{{ page.description }}",
  "url": "{{ page.url | absolute_url }}",
  "isAccessibleForFree": true,
  "license": "https://www.nationalarchives.gov.uk/doc/open-government-licence/",
  "creator": { "@type": "Organization", "name": "{{ site.title }}", "url": "{{ site.url }}" },
  "spatialCoverage": { "@type": "Place", "name": "Cheltenham, Gloucestershire, UK" },
  "temporalCoverage": "{% if page.crime_year %}{{ page.crime_year }}{% else %}{{ site.data.crime.index.years.first }}{% endif %}",
  "variableMeasured": ["Crime category", "Month", "Neighbourhood", "Approximate location"]
}
</script>
