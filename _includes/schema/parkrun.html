<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "Cheltenham Parkrun Events",

  "isBasedOn": "https://www.parkrun.org.uk/",

  "spatialCoverage": { "@type": "Place", "name": "Cheltenham, Gloucestershire, UK" },
  "variableMeasured": ["Event name", "Location", "Distance"]
}
</script>
