<style>
    .admin-tabs {
        display: flex;
        gap: .5rem;
        border-bottom: 1px solid var(--border);
        margin-bottom: 1.25rem;
    }

    .admin-tabs button {
        background: none;
        color: var(--text);
        border-radius: 4px 4px 0 0;
        padding: .6rem 1.1rem;
        font-weight: 600;
        opacity: .6;
    }

    .admin-tabs button:hover {
        background: var(--bg-alt);
        opacity: .85;
    }

    .admin-tabs button[aria-selected="true"] {
        opacity: 1;
        background: var(--bg-alt);
        box-shadow: inset 0 -3px 0 var(--accent);
    }

    .admin-panel {
        display: none;
    }

    .admin-panel.is-active {
        display: block;
    }
</style>

<div class="admin-tabs" role="tablist">
    <button type="button" role="tab" id="admin-tab-page-types" aria-controls="admin-panel-page-types"
        aria-selected="true" data-admin-tab="page-types">Page Types</button>
    <button type="button" role="tab" id="admin-tab-seo" aria-controls="admin-panel-seo" aria-selected="false"
        data-admin-tab="seo">Title &amp; Description</button>
    <button type="button" role="tab" id="admin-tab-sponsor-emails" aria-controls="admin-panel-sponsor-emails"
        aria-selected="false" data-admin-tab="sponsor-emails">Sponsor Emails</button>
    <button type="button" role="tab" id="admin-tab-social" aria-controls="admin-panel-social" aria-selected="false"
        data-admin-tab="social">Social Posts</button>
    <button type="button" role="tab" id="admin-tab-newsletter" aria-controls="admin-panel-newsletter"
        aria-selected="false" data-admin-tab="newsletter">Newsletter</button>
</div>

<div class="admin-panel is-active" id="admin-panel-page-types" role="tabpanel" aria-labelledby="admin-tab-page-types">
    {% include admin-page-types.html %}
</div>

<div class="admin-panel" id="admin-panel-seo" role="tabpanel" aria-labelledby="admin-tab-seo">
    {% include admin-seo.html %}
</div>

<div class="admin-panel" id="admin-panel-sponsor-emails" role="tabpanel" aria-labelledby="admin-tab-sponsor-emails">
    {% include admin-sponsor-emails.html %}
</div>

<div class="admin-panel" id="admin-panel-social" role="tabpanel" aria-labelledby="admin-tab-social">
    {% include admin-social.html %}
</div>

<div class="admin-panel" id="admin-panel-newsletter" role="tabpanel" aria-labelledby="admin-tab-newsletter">
    {% include admin-newsletter.html %}
</div>

<script>
    (function () {
        var tabs = Array.prototype.slice.call(document.querySelectorAll("[data-admin-tab]"));
        if (!tabs.length) return;

        function activate(name, updateHash) {
            tabs.forEach(function (tab) {
                var active = tab.dataset.adminTab === name;
                tab.setAttribute("aria-selected", active ? "true" : "false");
                var panel = document.getElementById("admin-panel-" + tab.dataset.adminTab);
                if (panel) panel.classList.toggle("is-active", active);
            });
            if (updateHash && history.replaceState) {
                history.replaceState(null, "", "#" + name);
            }
        }

        tabs.forEach(function (tab) {
            tab.addEventListener("click", function () {
                activate(tab.dataset.adminTab, true);
            });
        });

        var fromHash = window.location.hash.replace("#", "");
        if (fromHash && document.getElementById("admin-panel-" + fromHash)) {
            activate(fromHash, false);
        }
    })();
</script>
