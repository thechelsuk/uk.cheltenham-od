<style>
    #theme-table .swatch {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 5.5rem;
        padding: .4rem .85rem;
        background: var(--accent);
        color: var(--accent-text);
        border-radius: 6px;
        font-size: .8rem;
        font-weight: 600;
        letter-spacing: .02em;
        border: 1px solid rgba(0, 0, 0, .08);
    }

    #theme-table .hex {
        margin-left: .55rem;
        font-size: .78rem;
        vertical-align: middle;
        opacity: .65;
    }

    #theme-table .swatch-cell {
        white-space: nowrap;
    }
</style>

<div class="table-scroll">
    <table class="broadband-table" data-sortable id="theme-table">
        <thead>
            <tr>
                <th scope="col">Page</th>
                <th scope="col">Type</th>
                <th scope="col">Sponsor</th>
                <th scope="col">Light</th>
                <th scope="col">Dark</th>
            </tr>
        </thead>
        <tbody>
            {% assign pages = site.pages | where_exp: "p", "p.title" | sort_natural: "title" %}
            {% for page in pages %}
            <tr>
                <td data-val="{{ page.title | downcase }}"><a href="{{ page.url | relative_url }}">{{ page.title }}</a>
                </td>
                <td data-val="{{ page.type }}">{{ page.type }}</td>
                <td data-val="{% if page.sponsor.size > 0 %}1{% else %}0{% endif %}">{% if page.sponsor.size > 0
                    %}True{% else %}False{% endif %}</td>
                <td class="swatch-cell" data-swatch-cell><span class="swatch theme-{{ page.type }}"
                        data-swatch>Light</span><code class="hex"></code></td>
                <td class="swatch-cell" data-swatch-cell><span class="theme-preview--dark" data-theme="dark"><span
                            class="swatch theme-{{ page.type }}" data-swatch>Dark</span></span><code class="hex"></code>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    (function () {
        var table = document.getElementById("theme-table");
        if (!table) return;
        table.querySelectorAll("td[data-swatch-cell]").forEach(function (td) {
            var sw = td.querySelector("[data-swatch]");
            var code = td.querySelector(".hex");
            if (!sw) return;
            var hex = getComputedStyle(sw).getPropertyValue("--accent").trim();
            if (code) code.textContent = hex;
            td.setAttribute("data-val", hex);
        });
    })();
</script>
